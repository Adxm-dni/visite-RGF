<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo 12 - Visite virtuelle RGF</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            overflow: hidden;

            /* entrée fluide */
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(1.02);
                filter: blur(5px);
            }
            to {
                opacity: 1;
                transform: scale(1);
                filter: blur(0);
            }
        }

        /* sortie cinéma */
        .exit {
            animation: exitAnim 0.7s ease-in-out forwards;
        }

        @keyframes exitAnim {
            to {
                opacity: 0;
                transform: scale(1.1);
                filter: blur(8px);
            }
        }

        .container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        .photo {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;

            animation: zoomBg 10s ease-in-out infinite alternate;
        }

        @keyframes zoomBg {
            from { transform: scale(1); }
            to { transform: scale(1.03); }
        }

        /* boutons */
        .precedent, .bouton {
            position: absolute;
            bottom: 20px;

            background-color: #0078D7;
            color: white;

            border: none;
            border-radius: 10px;

            padding: 15px 30px;
            font-size: 20px;

            cursor: pointer;
            transition: 0.3s;
        }

        .precedent { left: 20px; }
        .bouton { right: 20px; }

        .precedent:hover,
        .bouton:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(0,120,215,0.5);
        }

    </style>

</head>

<body>

    <div class="container">

        <img src="photo12.jpeg" class="photo">

        <!-- précédent -->
        <button class="precedent" onclick="go('photo11.html')">
            Précédent
        </button>

        <!-- retour -->
        <button class="bouton" onclick="go('index.html')">
            Retour à l'accueil
        </button>

    </div>

    <script>
        function go(page) {
            document.body.classList.add("exit");

            setTimeout(() => {
                window.location.href = page;
            }, 650);
        }
    </script>

</body>

</html>
