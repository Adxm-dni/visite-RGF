<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photo 1</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    overflow: hidden;
    animation: fadeIn 0.6s ease-out;
}

@keyframes fadeIn {
    from { opacity: 0; transform: scale(1.02); filter: blur(6px); }
    to { opacity: 1; transform: scale(1); filter: blur(0); }
}

.exit {
    animation: exit 0.7s ease-in-out forwards;
}

@keyframes exit {
    100% {
        opacity: 0;
        transform: scale(1.1);
        filter: blur(10px);
    }
}

.container {
    position: relative;
    width: 100vw;
    height: 100vh;
}

.photo {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

/* flèches */
.arrow {
    position: absolute;
    top: 50%;
    width: 120px;
    height: 120px;
    transform: translateY(-50%);
    cursor: pointer;
}

.left { left: 18%; }
.right { right: 18%; }

.arrow::after {
    content: "";
    position: absolute;

    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0);

    width: 90px;
    height: 90px;
    border-radius: 50%;

    background: rgba(0,120,215,0.9);
    color: white;

    display: flex;
    justify-content: center;
    align-items: center;

    font-size: 45px;

    transition: 0.25s;
    box-shadow: 0 0 25px rgba(0,120,215,0.6);
}

.left::after { content: "⬅"; }
.right::after { content: "➡"; }

.arrow:hover::after {
    transform: translate(-50%, -50%) scale(1);
}

.arrow:hover {
    filter: brightness(1.2);
}

/* bouton */
.bouton {
    position: absolute;
    bottom: 20px;
    right: 20px;

    background: #0078D7;
    color: white;

    border: none;
    border-radius: 10px;

    padding: 15px 30px;
    font-size: 20px;

    cursor: pointer;
    transition: 0.3s;
}

.bouton:hover {
    transform: scale(1.05);
}

</style>
</head>

<body>

<div class="container">

    <img src="photo1.jpeg" class="photo">

    <div class="arrow left" onclick="go('photo2.html')"></div>
    <div class="arrow right" onclick="go('photo4.html')"></div>

    <button class="bouton" onclick="go('index.html')">
        Retour à l'accueil
    </button>

</div>

<script>
function go(page) {
    document.body.classList.add("exit");
    setTimeout(() => window.location.href = page, 650);
}
</script>

</body>
</html>
