<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photo 7 - Visite virtuelle RGF</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    overflow: hidden;

    animation: fadeIn 0.6s ease-out;
}

/* 🌟 entrée */
@keyframes fadeIn {
    from {
        opacity: 0;
        transform: scale(1.03);
        filter: blur(6px);
    }
    to {
        opacity: 1;
        transform: scale(1);
        filter: blur(0);
    }
}

/* 🌟 sortie */
.exit {
    animation: exitAnim 0.7s ease-in-out forwards;
}

@keyframes exitAnim {
    to {
        opacity: 0;
        transform: scale(1.1);
        filter: blur(10px);
    }
}

.container {
    position: relative;
    width: 100vw;
    height: 100vh;
}

.photo {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;

    animation: zoomBg 12s ease-in-out infinite alternate;
}

/* effet léger de vie */
@keyframes zoomBg {
    from { transform: scale(1); }
    to { transform: scale(1.04); }
}

/* 🌟 BOUTONS */
.bouton, .precedent {
    position: absolute;
    bottom: 20px;

    background-color: #0078D7;
    color: white;

    border: none;
    border-radius: 10px;

    padding: 15px 30px;
    font-size: 20px;

    cursor: pointer;

    transition: 0.3s;
}

/* positions */
.bouton { right: 20px; }
.precedent { left: 20px; }

/* hover moderne */
.bouton:hover,
.precedent:hover {
    transform: scale(1.05);
    box-shadow: 0 0 15px rgba(0,120,215,0.5);
}

/* petit effet profondeur */
body {
    transition: transform 0.1s ease-out;
}

</style>

</head>

<body>

<div class="container">

    <img src="photo7.jpeg" class="photo">

    <!-- précédent -->
    <button class="precedent"
            onclick="go('photo6.html')">
        Précédent
    </button>

    <!-- retour -->
    <button class="bouton"
            onclick="go('index.html')">
        Retour à l'accueil
    </button>

</div>

<script>
function go(page) {
    document.body.classList.add("exit");

    setTimeout(() => {
        window.location.href = page;
    }, 650);
}
</script>

</body>

</html>
