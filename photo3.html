<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photo 3 - Visite virtuelle RGF</title>

<style>

/* RESET */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    overflow: hidden;

    /* 🌟 entrée cohérente */
    animation: fadeIn 0.6s ease-out;
}

@keyframes fadeIn {
    from {
        opacity: 0;
        transform: scale(1.02);
        filter: blur(5px);
    }
    to {
        opacity: 1;
        transform: scale(1);
        filter: blur(0);
    }
}

/* 🌟 sortie */
.exit {
    animation: exitAnim 0.75s ease-in-out forwards;
}

@keyframes exitAnim {
    100% {
        opacity: 0;
        transform: scale(1.12);
        filter: blur(10px);
    }
}

.container {
    position: relative;
    width: 100vw;
    height: 100vh;
}

.photo {
    width: 100%;
    height: 100%;
    object-fit: cover;

    /* petit effet vivant */
    animation: zoomBg 10s ease-in-out infinite alternate;
}

@keyframes zoomBg {
    from { transform: scale(1); }
    to { transform: scale(1.03); }
}

/* 🌟 BOUTONS */
.bouton,
.precedent {
    position: absolute;
    bottom: 20px;

    background-color: #0078D7;
    color: white;

    border: none;
    border-radius: 10px;

    padding: 15px 30px;
    font-size: 20px;

    cursor: pointer;
    transition: 0.3s;
}

/* position */
.bouton { right: 20px; }
.precedent { left: 20px; }

/* hover plus smooth */
.bouton:hover,
.precedent:hover {
    transform: scale(1.05);
    box-shadow: 0 0 15px rgba(0,120,215,0.4);
}

</style>

</head>

<body>

<div class="container">

    <img src="photo3.jpeg" class="photo">

    <!-- précédent -->
    <button class="precedent" onclick="go('photo2.html')">
        Précédent
    </button>

    <!-- retour -->
    <button class="bouton" onclick="go('index.html')">
        Retour à l'accueil
    </button>

</div>

<script>
function go(page) {
    document.body.classList.add("exit");

    setTimeout(() => {
        window.location.href = page;
    }, 750);
}
</script>

</body>
</html>
