<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photo 2 - Visite virtuelle RGF</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    overflow: hidden;

    /* 🌟 entrée fluide */
    animation: fadeIn 0.6s ease-out;
}

@keyframes fadeIn {
    from {
        opacity: 0;
        transform: scale(1.02);
        filter: blur(5px);
    }
    to {
        opacity: 1;
        transform: scale(1);
        filter: blur(0);
    }
}

/* 🌟 sortie cinéma */
.exit {
    animation: exitAnim 0.75s ease-in-out forwards;
}

@keyframes exitAnim {
    0% {
        opacity: 1;
        transform: scale(1);
        filter: blur(0);
    }
    100% {
        opacity: 0;
        transform: scale(1.12);
        filter: blur(10px);
    }
}

.container {
    position: relative;
    width: 100vw;
    height: 100vh;
}

.photo {
    width: 100%;
    height: 100%;
    object-fit: cover;

    animation: zoomBg 10s ease-in-out infinite alternate;
}

@keyframes zoomBg {
    from { transform: scale(1); }
    to { transform: scale(1.03); }
}

/* 🌟 bouton central */
.avance {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 120px;
    height: 120px;
    transform: translate(-50%, -50%);
    cursor: pointer;
    transition: 0.3s;
}

.avance:hover {
    transform: translate(-50%, -50%) scale(1.05);
}

/* cercle */
.avance::after {
    content: "➜";
    position: absolute;

    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0);

    width: 90px;
    height: 90px;

    border-radius: 50%;
    background: rgba(0,120,215,0.9);

    color: white;
    font-size: 45px;

    display: flex;
    justify-content: center;
    align-items: center;

    transition: 0.25s;

    box-shadow: 0 0 25px rgba(0,120,215,0.6);
}

.avance:hover::after {
    transform: translate(-50%, -50%) scale(1);
}

/* 🌟 boutons bas */
.bouton {
    position: absolute;
    bottom: 20px;

    background-color: #0078D7;
    color: white;

    border: none;
    border-radius: 10px;

    padding: 15px 30px;
    font-size: 20px;

    cursor: pointer;
    transition: 0.3s;
}

.bouton:hover {
    transform: scale(1.05);
    box-shadow: 0 0 15px rgba(0,120,215,0.4);
}

.retour { right: 20px; }
.precedent { left: 20px; }

</style>

</head>

<body>

<div class="container">

    <img src="photo2.jpeg" class="photo">

    <!-- avancer -->
    <div class="avance" onclick="go('photo3.html')"></div>

    <!-- précédent -->
    <button class="bouton precedent" onclick="go('photo1.html')">
        Précédent
    </button>

    <!-- retour -->
    <button class="bouton retour" onclick="go('visite.html')">
        Retour
    </button>

</div>

<script>
function go(page) {
    document.body.classList.add("exit");

    setTimeout(() => {
        window.location.href = page;
    }, 750);
}
</script>

</body>
</html>
